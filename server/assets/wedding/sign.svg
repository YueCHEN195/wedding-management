<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3600" viewBox="0 0 2400 3600"><rect width="100%" height="100%" fill="{{night}}"/><text x="160" y="172" fill="{{muted}}" font-family="{{fontUi}}" font-size="44" font-weight="400" text-anchor="start" letter-spacing="0">{{coupleTitle}}</text><text x="2240" y="172" fill="{{muted}}" font-family="{{fontUi}}" font-size="38" font-weight="400" text-anchor="end" letter-spacing="0">{{date}}</text><svg x="104" y="288" width="2192" height="930" viewBox="0 0 2192 930"><defs><clipPath id="clip-104-288"><rect width="2192" height="930" rx="60"/></clipPath></defs><image width="2192" height="930" preserveAspectRatio="xMidYMin slice" href="{{photo}}" clip-path="url(#clip-104-288)"/></svg><text x="1200" y="1410" fill="{{text}}" font-family="{{fontBook}}" font-size="120" font-weight="300" text-anchor="middle" letter-spacing="8">相见，便是欢喜。</text><text x="1200" y="1530" fill="{{muted}}" font-family="{{fontUi}}" font-size="44" font-weight="400" text-anchor="middle" letter-spacing="0">欢迎来到我们的婚礼</text><text x="1200" y="2970" fill="{{text}}" font-family="{{fontUi}}" font-size="74" font-weight="400" text-anchor="middle" letter-spacing="8">扫码登记到场</text><text x="1200" y="3095" fill="{{muted}}" font-family="{{fontUi}}" font-size="44" font-weight="400" text-anchor="middle" letter-spacing="0">填写本人姓名 · 工作人员核对</text><path d="M320 3230h1760" stroke="{{divider}}"/><text x="1200" y="3350" fill="{{muted}}" font-family="{{fontUi}}" font-size="35" font-weight="400" text-anchor="middle" letter-spacing="0">扫码不便？请向现场工作人员登记。</text><text x="1200" y="3480" fill="{{muted}}" font-family="{{fontUi}}" font-size="28" font-weight="400" text-anchor="middle" letter-spacing="0">{{notice}}</text><svg x="640" y="1680" width="1120" height="1120" viewBox="0 0 1120 1120"><defs><clipPath id="clip-640-1680"><rect width="1120" height="1120" rx="0"/></clipPath></defs><image width="1120" height="1120" preserveAspectRatio="xMidYMid slice" href="{{qr}}" clip-path="url(#clip-6